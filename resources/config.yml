Lang:

  # Plugin language
  lang: ja_jp

  # Send messages to clients in their own language, if available
  client-lang: true

Options:

  # Plugin sends update notifications
  check-for-update: false

  # List of worlds where all features are disabled
  WorldBlacklist: []

  Sound:

    # Defines whether the extended note range should be used for sounds (requires resource pack for players)
    extened-range: true

    # Defines whether the resource pack should be automatically downloaded and applied to the user
    force-resources: false

  # Defines the default range a player can hear the sound of a jukebox
  jukebox-range: 20

  # Defines the max range of a jukebox (GUI limit)
  max-jukebox-range: 50

  # Defines the delay (in milliseconds) before jukebox auto-stops when no players are in range (10 minutes = 600000)
  jukebox-auto-stop-delay: 600000

  # Defines the range at which players can see jukebox particles (should be larger than max-jukebox-range)
  jukebox-particle-range: 100

  # Defines the default range for speaker mode (the first value for a player who has never used it)
  # スピーカーの届く範囲の既定（初めて使う人の値）
  speaker-default-range: 30

  # Defines how far players without GMusic.AMusic.* can widen the speaker range (GUI and playback)
  # If not set, it is the same as speaker-default-range (as before)
  # 住民（GMusic.AMusic.* でない人）が広げられる上限。書かなければ speaker-default-range と同じ（今まで通り）
  # member-max-speaker-range: 50

  # Defines the max range of speaker mode (admins can widen up to this)
  # スピーカーの範囲の全体の上限（管理者はここまで）
  max-speaker-range: 100

  # Multiplies the volume other players hear from a speaker (0.0 - 1.0). The speaker's own volume is not changed
  # 1.0 = as before. Distance falloff (uniform radius + squared falloff) stays the same
  # スピーカーを聞く側の音量に掛ける倍率（0.0〜1.0）。鳴らしている本人の音量は変わらない。1.0 で今まで通り
  speaker-listener-volume: 1.0

  ActionBar:

    # Defines whether there should be actionbar messages
    show-messages: true

    # Defines whether the currently playing song should always be displayed in the actionbar
    show-while-playing: true

  Radio:

    # Defines whether the radio should be active
    active: true

    # Defines whether the radio should play automatically when a player joins the server
    play-on-join: false

  # Defines whether a player should get a special sound effects in a certain environment (underwater)
  environment-effects: true

  PlayerSettings:

    # Defines the wait time until a song shuffles to the next
    time-until-shuffle: 1000

    # Defines the wait time until a song repeats
    time-until-repeat: 1000

    # Defines the wait time until a song to the next
    time-until-continue: 1000

    # Defines whether the settings of a player should be saved on quit
    save-on-quit: true

    Default:

      playlist-mode: 0
      volume: 70
      join: false
      play-mode: 0
      reverse: false
      particles: false
      speaker-mode: false
      mute-speakers: false

  GUI:

    disable-random-song: false
    disable-playlist: false
    disable-speaker-mode: false
    disable-favorites: false